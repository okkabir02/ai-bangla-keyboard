name: Build AI Bangla Keyboard APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android Project Files
        run: |
          mkdir -p app/src/main/java/com/banglacodes/aitranslatorkeyboard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIKeyboard"
          include ':app'
          EOF

          # build.gradle (Project)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.banglacodes.aitranslatorkeyboard'
              compileSdk 34

              defaultConfig {
                  applicationId "com.banglacodes.aitranslatorkeyboard"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ".debug"
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="AI Bangla Keyboard"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".KeyboardService"
                      android:label="AI Bangla Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
                  <service
                      android:name=".ChatOverlayService"
                      android:label="AI Live Translator Overlay"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # XMLs
          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android">
              <subtype
                  android:label="AI Bangla IME"
                  android:imeSubtypeLocale="bn_BD"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Bangla Keyboard</string>
              <string name="accessibility_desc">স্ক্রিনের বিদেশি মেসেজ বাংলায় দেখতে সার্ভিসটি অন করুন।</string>
          </resources>
          EOF

          # TranslationHelper.kt
          cat << 'EOF' > app/src/main/java/com/banglacodes/aitranslatorkeyboard/TranslationHelper.kt
          package com.banglacodes.aitranslatorkeyboard

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import java.net.URLEncoder
          import java.util.concurrent.TimeUnit

          object TranslationHelper {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(10, TimeUnit.SECONDS)
                  .readTimeout(10, TimeUnit.SECONDS)
                  .build()

              suspend fun translate(text: String, sl: String = "auto", tl: String = "en"): String {
                  if (text.isBlank()) return ""
                  return withContext(Dispatchers.IO) {
                      try {
                          val q = URLEncoder.encode(text, "UTF-8")
                          val url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=$sl&tl=$tl&dt=t&q=$q"
                          val req = Request.Builder()
                              .url(url)
                              .header("User-Agent", "Mozilla/5.0")
                              .build()
                          val res = client.newCall(req).execute()
                          val bodyString = res.body?.string() ?: return@withContext text
                          val json = JSONArray(bodyString)
                          val arr = json.getJSONArray(0)
                          val sb = StringBuilder()
                          for (i in 0 until arr.length()) {
                              sb.append(arr.getJSONArray(i).getString(0))
                          }
                          val result = sb.toString()
                          if (result.isNotBlank()) result else text
                      } catch (e: Exception) {
                          text
                      }
                  }
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/banglacodes/aitranslatorkeyboard/MainActivity.kt
          package com.banglacodes.aitranslatorkeyboard

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(0xFF0F172A.toInt())
                  }

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 60)
                  }
                  scroll.addView(layout)

                  val title = TextView(this).apply {
                      text = "✨ AI Bangla Keyboard Setup"
                      textSize = 22f
                      setTextColor(0xFF38BDF8.toInt())
                      setPadding(0, 0, 0, 10)
                  }
                  layout.addView(title)

                  val subtitle = TextView(this).apply {
                      text = "বাংলা টাইপিং ও স্ক্রিন অনুবাদ সক্রিয় করতে নিচের ধাপগুলো সম্পূর্ণ করুন:"
                      textSize = 14f
                      setTextColor(0xFF94A3B8.toInt())
                      setPadding(0, 0, 0, 40)
                  }
                  layout.addView(subtitle)

                  val b1 = Button(this).apply {
                      text = "১. কিবোর্ড চালু করুন (Enable)"
                      setBackgroundColor(0xFF1E293B.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  }
                  layout.addView(b1)

                  val b2 = Button(this).apply {
                      text = "২. কিবোর্ড সিলেক্ট করুন (Select Default)"
                      setBackgroundColor(0xFF1E293B.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }
                  }
                  layout.addView(b2)

                  val b3 = Button(this).apply {
                      text = "৩. স্ক্রিন অনুবাদ সার্ভিস চালু করুন"
                      setBackgroundColor(0xFF38BDF8.toInt())
                      setTextColor(0xFF0F172A.toInt())
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }
                  layout.addView(b3)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      val b4 = Button(this).apply {
                          text = "৪. স্ক্রিন ওভারলে পারমিশন দিন"
                          setBackgroundColor(0xFFEF4444.toInt())
                          setTextColor(0xFFFFFFFF.toInt())
                          setOnClickListener {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          }
                      }
                      layout.addView(b4)
                  }

                  // Live test field
                  val testTitle = TextView(this).apply {
                      text = "\n⌨️ এখানে টাইপ করে কিবোর্ড পরীক্ষা করুন:"
                      setTextColor(0xFFE2E8F0.toInt())
                      textSize = 15f
                      setPadding(0, 30, 0, 10)
                  }
                  layout.addView(testTitle)

                  val testInput = EditText(this).apply {
                      hint = "এখানে ক্লিক করুন..."
                      setHintTextColor(0xFF64748B.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setBackgroundColor(0xFF1E293B.toInt())
                      setPadding(30, 24, 30, 24)
                  }
                  layout.addView(testInput)

                  setContentView(scroll)
              }
          }
          EOF

          # KeyboardService.kt
          cat << 'EOF' > app/src/main/java/com/banglacodes/aitranslatorkeyboard/KeyboardService.kt
          package com.banglacodes.aitranslatorkeyboard

          import android.inputmethodservice.InputMethodService
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import java.util.Locale

          class KeyboardService : InputMethodService() {
              private val scope = CoroutineScope(Dispatchers.Main)
              private var isBanglaMode = true
              private var isCaps = false
              private lateinit var input: EditText
              private lateinit var status: TextView
              private lateinit var keyboardContainer: LinearLayout

              override fun onCreateInputView(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF0F172A.toInt())
                      setPadding(8, 8, 8, 12)
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }

                  // Top Smart Action Bar
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  input = EditText(this).apply {
                      hint = "বাংলায় টাইপ করুন..."
                      setHintTextColor(0xFF64748B.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 15f
                      setBackgroundColor(0xFF1E293B.toInt())
                      setPadding(16, 12, 16, 12)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val sendBtn = Button(this).apply {
                      text = "AI সেন্ড 🚀"
                      setBackgroundColor(0xFF38BDF8.toInt())
                      setTextColor(0xFF0F172A.toInt())
                      setOnClickListener {
                          val txt = input.text.toString().trim()
                          if (txt.isNotEmpty()) {
                              status.text = "AI অনুবাদ হচ্ছে..."
                              scope.launch {
                                  val en = TranslationHelper.translate(txt, "bn", "en")
                                  currentInputConnection?.commitText(en, 1)
                                  input.setText("")
                                  status.text = "সরাসরি ইংরেজিতে পাঠানো হয়েছে!"
                              }
                          }
                      }
                  }
                  topBar.addView(input)
                  topBar.addView(sendBtn)
                  root.addView(topBar)

                  status = TextView(this).apply {
                      text = "AI বাংলা কিবোর্ড প্রস্তুত"
                      setTextColor(0xFF38BDF8.toInt())
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, 6, 0, 6)
                  }
                  root.addView(status)

                  keyboardContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  root.addView(keyboardContainer)

                  renderKeypad()
                  return root
              }

              private fun renderKeypad() {
                  keyboardContainer.removeAllViews()

                  if (isBanglaMode) {
                      // Kar bar
                      val karBar = HorizontalScrollView(this)
                      val karLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(0, 4, 0, 6)
                      }
                      val kars = listOf("া","ি","ী","ু","ূ","ৃ","ে","ৈ","ো","ৌ","্","ৎ","ং","ঃ","ঁ")
                      for (k in kars) {
                          karLayout.addView(buildKey(k, 1f) { input.append(k) })
                      }
                      karBar.addView(karLayout)
                      keyboardContainer.addView(karBar)

                      val b1 = listOf("ক","খ","গ","ঘ","ঙ","চ","ছ","জ","ঝ","ঞ")
                      val b2 = listOf("ট","ঠ","ড","ঢ","ণ","ত","থ","দ","ধ","ন")
                      val b3 = listOf("প","ফ","ব","ভ","ম","য","র","ল","শ","ষ")
                      val b4 = listOf("স","হ","ড়","ঢ়","য়","অ","আ","ই","উ","এ")

                      keyboardContainer.addView(buildRow(b1))
                      keyboardContainer.addView(buildRow(b2))
                      keyboardContainer.addView(buildRow(b3))

                      val r4 = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          weightSum = 10f
                      }
                      r4.addView(buildKey("⌫", 1.5f) { deleteChar() })
                      for (k in b4.take(7)) {
                          r4.addView(buildKey(k, 1f) { input.append(k) })
                      }
                      r4

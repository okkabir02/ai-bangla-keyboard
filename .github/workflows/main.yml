name: Build AI Bangla Keyboard

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete App Code
        run: |
          mkdir -p app/src/main/java/com/banglacodes/aitranslatorkeyboard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIKeyboard"
          include ':app'
          EOF

          # build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.banglacodes.aitranslatorkeyboard'
              compileSdk 34

              defaultConfig {
                  applicationId "com.banglacodes.aitranslatorkeyboard"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="AI Bangla Keyboard"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".KeyboardService"
                      android:label="AI Bangla Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
                  <service
                      android:name=".ChatOverlayService"
                      android:label="AI Live Translator Overlay"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # XMLs
          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android">
              <subtype
                  android:label="AI Bangla IME"
                  android:imeSubtypeLocale="bn_BD"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Bangla Keyboard</string>
              <string name="accessibility_desc">স্ক্রিনের বিদেশি মেসেজ বাংলায় দেখতে সার্ভিসটি অন করুন।</string>
          </resources>
          EOF

          # TranslationHelper.kt
          cat << 'EOF' > app/src/main/java/com/banglacodes/aitranslatorkeyboard/TranslationHelper.kt
          package com.banglacodes.aitranslatorkeyboard
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import java.net.URLEncoder

          object TranslationHelper {
              private val client = OkHttpClient()
              suspend fun translate(text: String, sl: String, tl: String): String {
                  return withContext(Dispatchers.IO) {
                      try {
                          val q = URLEncoder.encode(text, "UTF-8")
                          val url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=$sl&tl=$tl&dt=t&q=$q"
                          val req = Request.Builder().url(url).build()
                          val res = client.newCall(req).execute()
                          val json = JSONArray(res.body?.string() ?: return@withContext text)
                          val arr = json.getJSONArray(0)
                          val sb = StringBuilder()
                          for (i in 0 until arr.length()) {
                              sb.append(arr.getJSONArray(i).getString(0))
                          }
                          sb.toString()
                      } catch (e: Exception) { text }
                  }
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/banglacodes/aitranslatorkeyboard/MainActivity.kt
          package com.banglacodes.aitranslatorkeyboard
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF0F172A.toInt())
                      setPadding(40, 60, 40, 40)
                  }
                  val title = TextView(this).apply {
                      text = "✨ AI Bangla Keyboard Setup"
                      textSize = 20f
                      setTextColor(0xFF38BDF8.toInt())
                      setPadding(0, 0, 0, 30)
                  }
                  layout.addView(title)

                  val b1 = Button(this).apply {
                      text = "১. কিবোর্ড চালু করুন"
                      setBackgroundColor(0xFF1E293B.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  }
                  layout.addView(b1)

                  val b2 = Button(this).apply {
                      text = "২. কিবোর্ড সিলেক্ট করুন"
                      setBackgroundColor(0xFF1E293B.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                      }
                  }
                  layout.addView(b2)

                  val b3 = Button(this).apply {
                      text = "৩. স্ক্রিন অনুবাদ সার্ভিস চালু করুন"
                      setBackgroundColor(0xFF38BDF8.toInt())
                      setTextColor(0xFF0F172A.toInt())
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }
                  layout.addView(b3)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      val b4 = Button(this).apply {
                          text = "৪. স্ক্রিন ওভারলে পারমিশন দিন"
                          setBackgroundColor(0xFFEF4444.toInt())
                          setTextColor(0xFFFFFFFF.toInt())
                          setOnClickListener {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          }
                      }
                      layout.addView(b4)
                  }
                  setContentView(layout)
              }
          }
          EOF

          # KeyboardService.kt
          cat << 'EOF' > app/src/main/java/com/banglacodes/aitranslatorkeyboard/KeyboardService.kt
          package com.banglacodes.aitranslatorkeyboard
          import android.inputmethodservice.InputMethodService
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import java.util.Locale

          class KeyboardService : InputMethodService() {
              private val scope = CoroutineScope(Dispatchers.Main)
              private var isCaps = false
              private lateinit var input: EditText
              private lateinit var status: TextView

              override fun onCreateInputView(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF0F172A.toInt())
                      setPadding(6, 6, 6, 10)
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  input = EditText(this).apply {
                      hint = "বাংলায় টাইপ করুন..."
                      setHintTextColor(0xFF64748B.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 14f
                      setBackgroundColor(0xFF1E293B.toInt())
                      setPadding(14, 10, 14, 10)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val sendBtn = Button(this).apply {
                      text = "AI সেন্ড 🚀"
                      setBackgroundColor(0xFF38BDF8.toInt())
                      setTextColor(0xFF0F172A.toInt())
                      setOnClickListener {
                          val txt = input.text.toString().trim()
                          if (txt.isNotEmpty()) {
                              status.text = "অনুবাদ হচ্ছে..."
                              scope.launch {
                                  val en = TranslationHelper.translate(txt, "bn", "en")
                                  currentInputConnection?.commitText(en, 1)
                                  input.setText("")
                                  status.text = "পাঠানো হয়েছে!"
                              }
                          }
                      }
                  }
                  topBar.addView(input)
                  topBar.addView(sendBtn)
                  root.addView(topBar)

                  status = TextView(this).apply {
                      text = "বাংলা টাইপিং প্রস্তুত"
                      setTextColor(0xFF38BDF8.toInt())
                      textSize = 11f
                      gravity = Gravity.CENTER
                  }
                  root.addView(status)

                  val r1 = listOf("Q","W","E","R","T","Y","U","I","O","P")
                  val r2 = listOf("A","S","D","F","G","H","J","K","L")
                  val r3 = listOf("Z","X","C","V","B","N","M")

                  root.addView(buildRow(r1))
                  root.addView(buildRow(r2))

                  val row3Layout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      weightSum = 10f
                  }
                  row3Layout.addView(buildKey("⇧", 1.5f) { isCaps = !isCaps })
                  for (k in r3) {
                      row3Layout.addView(buildKey(k, 1f) {
                          input.append(if (isCaps) k else k.lowercase(Locale.ROOT))
                      })
                  }
                  row3Layout.addView(buildKey("⌫", 1.5f) {
                      val cur = input.text.toString()
                      if (cur.isNotEmpty()) {
                          input.setText(cur.substring(0, cur.length - 1))
                          input.setSelection(input.text.length)
                      }
                  })
                  root.addView(row3Layout)

                  val bottom = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      weightSum = 10f
                  }
                  bottom.addView(buildKey("Clear", 2f) { input.setText("") })
                  bottom.addView(buildKey("Space", 5f) { input.append(" ") })
                  bottom.addView(buildKey("Direct", 3f) {
                      currentInputConnection?.commitText(input.text.toString(), 1)
                      input.setText("")
                  })
                  root.addView(bottom)
                  return root
              }

              private fun buildRow(keys: List<String>): LinearLayout {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      weightSum = keys.size.toFloat()
                  }
                  for (k in keys) {
                      row.addView(buildKey(k, 1f) {
                          input.append(if (isCaps) k else k.lowercase(Locale.ROOT))
                      })
                  }
                  return row
              }

              private fun buildKey(txt: String, w: Float, action: () -> Unit): Button {
                  return Button(this).apply {
                      text = txt
                      textSize = 13f
                      setTextColor(0xFFFFFFFF.toInt())
                      setBackgroundColor(0xFF334155.toInt())
                      layoutParams = LinearLayout.LayoutParams(0, 110, w).apply {
                          setMargins(2, 2, 2, 2)
                      }
                      setPadding(0, 0, 0, 0)
                      setOnClickListener { action() }
                  }
              }
          }
          EOF

          # ChatOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/banglacodes/aitranslatorkeyboard/ChatOverlayService.kt
          package com.banglacodes.aitranslatorkeyboard
          import android.accessibilityservice.AccessibilityService
          import android.graphics.PixelFormat
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.TextView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch

          class ChatOverlayService : AccessibilityService() {
              private val scope = CoroutineScope(Dispatchers.Main)
              private var wm: WindowManager? = null
              private var view: TextView? = null
              private var last = ""

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  view = TextView(this).apply {
                      setBackgroundColor(0xEE0F172A.toInt())
                      setTextColor(0xFF38BDF8.toInt())
                      setPadding(24, 14, 24, 14)
                      textSize = 13f
                      text = "🌐 লাইভ অনুবাদ রেডি"
                  }
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.Layout
